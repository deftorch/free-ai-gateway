# Satu perintah untuk self-host: docker compose up -d
# Sesuai §3 MVP: "Docker image single-container + docker-compose.yml siap pakai"

services:
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8787:8787"
    env_file:
      - ../.env
    environment:
      - DB_FILE_PATH=/data/gateway.sqlite
    volumes:
      - gateway-data:/data
    restart: unless-stopped

volumes:
  gateway-data:
