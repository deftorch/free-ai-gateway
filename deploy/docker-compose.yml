# Satu perintah untuk self-host: docker compose up -d
# Sesuai §3 MVP: "Docker image single-container + docker-compose.yml siap pakai"

services:
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8787:8787"
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=file:/data/gateway.db
      - KV_DRIVER=redis
      - REDIS_URL=redis://redis:6379
    volumes:
      - gateway-data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  gateway-data:
  redis-data:
