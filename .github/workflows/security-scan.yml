name: Security scan

on:
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # tiap Senin — tangkap CVE baru walau tidak ada PR

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: bun pm scan (audit kerentanan dependency)
        run: bun install --frozen-lockfile && bun pm scan
      - name: osv-scanner
        uses: google/osv-scanner-action@v2
        with:
          scan-args: |-
            --recursive
            ./
