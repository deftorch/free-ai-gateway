name: Contract tests (adapters)

on:
  pull_request:
    paths:
      - "adapters/**"
      - "packages/core/**"

jobs:
  contract-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Jalankan contract test terhadap SEMUA adapter (fixture nyata)
        run: bun run test:contract
